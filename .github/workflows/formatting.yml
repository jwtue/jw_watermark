name: Formatting

# Keeps the whitespace conventions from .editorconfig enforced, so a
# contribution made with a normally configured IDE no longer produces a
# whitespace-heavy diff. Runs the same script contributors run locally:
#   sh .github/check-formatting.sh
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace conventions
        run: sh .github/check-formatting.sh

      - name: Check PHP syntax
        run: |
          # A reformat must never change behaviour; a syntax check is the cheap
          # part of that guarantee.
          for f in $(git ls-files '*.php'); do
            php -l "$f"
          done
