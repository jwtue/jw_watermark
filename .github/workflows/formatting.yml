name: Formatting

# Keeps the coding style enforced, so a contribution made with a normally
# configured IDE no longer produces a whitespace-heavy diff.
#
# Two jobs on purpose: the whitespace job is cheap, needs no dependencies and
# also covers the non-PHP files; the php-cs-fixer job is the authoritative
# style check for PHP but has to install the dev toolchain first.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace conventions
        run: sh .github/check-formatting.sh

      - name: Check PHP syntax
        run: |
          for f in $(git ls-files '*.php'); do
            php -l "$f"
          done

  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.2, not the extension's minimum of 8.1: typo3/coding-standards and the
          # current typo3/cms-core both require ^8.2, so the dev toolchain cannot be
          # installed on 8.1. php-cs-fixer will note the mismatch with composer.json
          # and that warning is expected.
          php-version: '8.2'
          extensions: intl, mbstring, json
          tools: composer

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check coding style
        run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff
